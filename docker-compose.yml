version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teen-patti-db
    environment:
      POSTGRES_USER: teen_patti
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: teen_patti_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teen_patti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teen-patti-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
